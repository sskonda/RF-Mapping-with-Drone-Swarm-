name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./Mapping/RF_Mapping pytest
      - name: Compile Python
        run: python -m compileall -q rf_mapper.py Mapping/RF_Mapping/src Development/Tests
      - name: Run tests
        run: python -m unittest discover -s Development/Tests/RF_Mapping -v
      - name: Run pytest
        run: python -m pytest -q
      - name: Build RF wheel
        run: python -m pip wheel ./Mapping/RF_Mapping --no-deps --wheel-dir /tmp/rf-mapping-wheels
      - name: Check installed CLI outside checkout
        working-directory: /tmp
        run: |
          rf-mapper --help
          python -m rf_mapping.cli.rf_mapper --help

  flight-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test flight bench safety and sensor decoding
        run: |
          cmake -S Development/Tests/Flight_Controller -B /tmp/fc-tests -DFC_SANITIZE=ON
          cmake --build /tmp/fc-tests
          ctest --test-dir /tmp/fc-tests --output-on-failure

  flight-esp32s3:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 bench firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C ESP32_Code/Autonomy/Flight_Controller build
