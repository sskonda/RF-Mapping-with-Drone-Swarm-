name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./Mapping/RF_Mapping pytest
      - name: Compile Python
        run: python -m compileall -q rf_mapper.py Mapping/RF_Mapping/src Development/Tests
      - name: Run tests
        run: python -m unittest discover -s Development/Tests/RF_Mapping -v
      - name: Run pytest
        run: python -m pytest -q
      - name: Build RF wheel
        run: python -m pip wheel ./Mapping/RF_Mapping --no-deps --wheel-dir /tmp/rf-mapping-wheels
      - name: Check installed CLI outside checkout
        working-directory: /tmp
        run: |
          rf-mapper --help
          python -m rf_mapping.cli.rf_mapper --help
